<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraftHosting · Sunucu Test Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171C;
    --panel: #1B1F26;
    --panel-line: #2A303A;
    --accent: #6B9B5E;
    --accent-dim: #4C7343;
    --fail: #B0413E;
    --warn: #C7924B;
    --text: #E8E6DF;
    --text-muted: #8B93A1;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(107,155,94,0.06), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(107,155,94,0.05), transparent 40%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 8vh 20px;
  }

  main {
    width: 100%;
    max-width: 560px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }

  .sub {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 32px;
    line-height: 1.5;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--panel-line);
  }

  /* Signature element: a faceted block mark whose state communicates
     connection status, echoing the voxel geometry of the servers being tested. */
  .block {
    width: 18px;
    height: 18px;
    position: relative;
    flex-shrink: 0;
    transform: rotate(45deg);
    background: #3A414D;
    transition: background 0.3s ease;
  }
  .block::after {
    content: '';
    position: absolute;
    inset: 3px;
    background: #262C35;
    transition: background 0.3s ease;
  }
  .block.connecting { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
  .block.success { background: var(--accent); }
  .block.fail { background: var(--fail); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .status-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
  }
  .status-text b { color: var(--text); font-weight: 500; }

  form {
    padding: 20px;
    display: grid;
    gap: 14px;
    border-bottom: 1px solid var(--panel-line);
  }

  .field {
    display: grid;
    grid-template-columns: 110px 1fr;
    align-items: center;
    gap: 12px;
  }

  label {
    font-size: 13px;
    color: var(--text-muted);
  }

  input {
    background: #12151A;
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    padding: 9px 11px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input:focus { border-color: var(--accent); }

  button {
    margin-top: 6px;
    background: var(--accent);
    color: #12151A;
    border: none;
    border-radius: 6px;
    padding: 11px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) { background: var(--accent-dim); }
  button:disabled { background: #3A414D; color: var(--text-muted); cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .log {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    line-height: 1.7;
    padding: 18px 20px;
    max-height: 320px;
    overflow-y: auto;
    color: var(--text-muted);
  }
  .log .line { white-space: pre-wrap; word-break: break-word; }
  .log .line.ok { color: var(--accent); }
  .log .line.err { color: var(--fail); }
  .log .empty { color: #545C68; }

  footer {
    margin-top: 20px;
    font-size: 12px;
    color: #545C68;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .block.connecting { animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="eyebrow">CraftHosting</div>
  <h1>Sunucu Test Paneli</h1>
  <p class="sub">Minecraft sunucunuza tek bir test botu bağlanır ve giriş kabul edip etmediğini kontrol eder.</p>

  <div class="panel">
    <div class="panel-head">
      <div class="block" id="statusBlock"></div>
      <div class="status-text" id="statusText">Durum: <b>hazır</b></div>
    </div>

    <form id="testForm">
      <div class="field">
        <label for="host">Sunucu adresi</label>
        <input id="host" name="host" placeholder="play.crafthosting.com.tr" required>
      </div>
      <div class="field">
        <label for="port">Port</label>
        <input id="port" name="port" placeholder="25565" value="25565">
      </div>
      <div class="field">
        <label for="username">Kullanıcı adı</label>
        <input id="username" name="username" placeholder="TestBot" value="TestBot">
      </div>
      <button type="submit" id="submitBtn">Testi Başlat</button>
    </form>

    <div class="log" id="log">
      <div class="empty">Henüz test çalıştırılmadı.</div>
    </div>
  </div>

  <footer>Aynı anda yalnızca bir test çalıştırılabilir.</footer>
</main>

<script>
  const form = document.getElementById('testForm');
  const logEl = document.getElementById('log');
  const statusBlock = document.getElementById('statusBlock');
  const statusText = document.getElementById('statusText');
  const submitBtn = document.getElementById('submitBtn');

  function setStatus(state, label) {
    statusBlock.className = 'block' + (state ? ' ' + state : '');
    statusText.innerHTML = 'Durum: <b>' + label + '</b>';
  }

  function addLine(text, cls) {
    const div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const host = document.getElementById('host').value.trim();
    const port = document.getElementById('port').value.trim() || '25565';
    const username = document.getElementById('username').value.trim() || 'TestBot';
    if (!host) return;

    logEl.innerHTML = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Test çalışıyor…';
    setStatus('connecting', 'bağlanıyor');

    const url = '/api/test?host=' + encodeURIComponent(host) +
                '&port=' + encodeURIComponent(port) +
                '&username=' + encodeURIComponent(username);
    const source = new EventSource(url);

    source.onmessage = (ev) => {
      const line = ev.data;
      let cls = '';
      if (line.includes('✅') || line.includes('BAŞARILI')) { cls = 'ok'; setStatus('success', 'başarılı'); }
      else if (line.includes('❌') || line.includes('BAŞARISIZ') || line.includes('HATA')) { cls = 'err'; setStatus('fail', 'başarısız'); }
      addLine(line, cls);
    };

    source.addEventListener('done', () => {
      source.close();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Testi Başlat';
    });

    source.onerror = () => {
      addLine('Bağlantı sonlandı.', 'err');
      setStatus('fail', 'hata');
      source.close();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Testi Başlat';
    };
  });
</script>
</body>
</html>
